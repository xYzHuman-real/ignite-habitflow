name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: gradle assembleDebug --stacktrace
      - name: Build release APK and AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitflow-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload release AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitflow-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
